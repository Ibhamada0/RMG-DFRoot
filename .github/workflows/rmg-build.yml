name: Build RMP on the original DFRoot engine

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lkm/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lkm:
    name: Kernel module / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build original dfroot.ko
        run: |
          set -eu
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata \
            -R .hyp.event_ids -R .hyp.patchable_function_entries \
            -R .hyp.data dfroot.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp dfroot.ko "$GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko"
      - uses: actions/upload-artifact@v4
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko
          if-no-files-found: error

  android-apk:
    needs: build-lkm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: actions/download-artifact@v4
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - name: Embed checked official Manager APKs for offline use
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/managers
          curl -fL --retry 3 -o app/src/main/assets/managers/ksu-next-v3.4.2.apk \
             "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2_33355-release.apk"
          curl -fL --retry 3 -o app/src/main/assets/managers/ksu-samsung-v2.2.apk \
             "https://github.com/diabl0w/KernelSU/releases/download/samsung-v2.2/KernelSU_samsung-v2.2_32687-release.apk"
          echo "774a5511f7034a4930e881114e202319cbdc34c5aaaa5c7c6b6d2902364e4c58  app/src/main/assets/managers/ksu-next-v3.4.2.apk" | sha256sum -c -
          echo "761dffad54ae080a4977971db7b04e2fc65c2d9b5e2336accca4a85661290a69  app/src/main/assets/managers/ksu-samsung-v2.2.apk" | sha256sum -c -

      - name: Check stable release signing credentials
        id: signing
        shell: bash
        env:
          RMP_KEYSTORE_BASE64: ${{ secrets.RMP_KEYSTORE_BASE64 }}
          RMP_KEYSTORE_PASSWORD: ${{ secrets.RMP_KEYSTORE_PASSWORD }}
          RMP_KEY_ALIAS: ${{ secrets.RMP_KEY_ALIAS }}
          RMP_KEY_PASSWORD: ${{ secrets.RMP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$RMP_KEYSTORE_BASE64" && -n "$RMP_KEYSTORE_PASSWORD" && -n "$RMP_KEY_ALIAS" && -n "$RMP_KEY_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Stable release signing secrets detected.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Stable signing secrets missing. No public Release will be published. Set four RMP_* secrets and rerun.'
          fi

      - name: Compile debug test only (not updatable)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -s "$APK"
          mkdir -p out-ci
          cp "$APK" out-ci/RMP-debug-CI-TEST-ONLY.apk

      - name: Upload debug test artifact (never a public Release)
        uses: actions/upload-artifact@v4
        with:
          name: RMP-debug-not-updatable
          path: out-ci/RMP-debug-CI-TEST-ONLY.apk
          if-no-files-found: error

      - name: Decode private release signing keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          RMP_KEYSTORE_BASE64: ${{ secrets.RMP_KEYSTORE_BASE64 }}
          RMP_KEYSTORE_PASSWORD: ${{ secrets.RMP_KEYSTORE_PASSWORD }}
          RMP_KEY_ALIAS: ${{ secrets.RMP_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/rmp-release.jks"
          printf '%s' "$RMP_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass "$RMP_KEYSTORE_PASSWORD" -alias "$RMP_KEY_ALIAS" > /dev/null
          echo "RMP_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Assemble and verify stable signed release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          RMP_KEYSTORE_PASSWORD: ${{ secrets.RMP_KEYSTORE_PASSWORD }}
          RMP_KEY_ALIAS: ${{ secrets.RMP_KEY_ALIAS }}
          RMP_KEY_PASSWORD: ${{ secrets.RMP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" RMP-Original-DFRoot.apk
          unzip -t RMP-Original-DFRoot.apk | tail -1
          sha256sum RMP-Original-DFRoot.apk > RMP-Original-DFRoot.apk.sha256

      - name: Upload stable signed APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RMP-signed-updatable-APK
          path: |
            RMP-Original-DFRoot.apk
            RMP-Original-DFRoot.apk.sha256
          if-no-files-found: error

      - name: Publish stable-signed GitHub Release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rmp-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: RMP v4.14 | Signed Releases + In-App Updates | Build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          draft: false
          body: |
            RMP_VERSION_CODE=414

            **Stable release-key signed APK.** Future updates retain application
            ID df.root and MUST use this SAME private signing key.
            Open Settings > Check for updates (or Check RMP App Updates on Home)
            to check GitHub Releases, download, verify SHA-256/cert and ask
            Android to install the APK over the current app.

            IMPORTANT: Earlier debug-signed Builds 1–13 do NOT share this
            stable signing identity. Unless their original private debug key
            is available, upgrading from them requires a one-time uninstall
            and reinstall. Export local data/logs before uninstalling.

            Original diabl0w/DFRoot root engine pinned upstream
            c274137e8c02b4f94f64d1b132d991b80c747340 is unchanged.
            Built-in SU Manager installers, session History, six themes, FAQ.
            Experimental software; actual root success not guaranteed.
          files: |
            RMP-Original-DFRoot.apk
            RMP-Original-DFRoot.apk.sha256
